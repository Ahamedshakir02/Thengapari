<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ThengaPari · Homeowner App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="app.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <rect width="96" height="96" rx="20" fill="#1E4D2B"/>
    <path d="M48 44 C48 33 44 24 34 18 C32 30 38 39 48 44 Z" fill="#BCD6A3"/>
    <path d="M48 44 C48 33 52 24 62 18 C64 30 58 39 48 44 Z" fill="#94B97F"/>
    <circle cx="48" cy="64" r="22" fill="#F4A52A"/>
    <circle cx="42" cy="60" r="2.6" fill="#A65B12"/>
    <circle cx="54" cy="60" r="2.6" fill="#A65B12"/>
    <circle cx="48" cy="69" r="2.6" fill="#A65B12"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app-i18n.jsx"></script>
<script type="text/babel" src="app-icons.jsx"></script>
<script type="text/babel" src="app-charts.jsx"></script>
<script type="text/babel" src="app-screens-flow.jsx"></script>
<script type="text/babel" src="app-screens-report.jsx"></script>
<script type="text/babel" src="app-screens-home.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F4A52A",
  "chart": "leaf",
  "density": "cozy",
  "greeting": "morning",
  "greetName": "Rahul"
}/*EDITMODE-END*/;

// accent hex → companion tokens (text color on accent + glow)
const ACCENTS = {
  "#F4A52A": { on: "var(--green-forest-900)", glow: "0 6px 18px rgba(244,165,42,.30)" },
  "#DD8413": { on: "#FFFFFF",                 glow: "0 6px 18px rgba(221,132,19,.32)" },
  "#D2693C": { on: "#FFFFFF",                 glow: "0 6px 18px rgba(210,105,60,.30)" },
  "#15786B": { on: "#FFFFFF",                 glow: "0 6px 18px rgba(21,120,107,.30)" },
};

const FRAMES = [
  { id: 'home',    label: '1 · Home dashboard',  initial: 'home' },
  { id: 'book',    label: '2 · Book a harvest',  initial: 'book' },
  { id: 'tracker', label: '3 · Live job tracker', initial: 'tracker' },
  { id: 'report',  label: '4 · Yield report',    initial: 'report' },
];

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('tp_lang') || 'en'; } catch (e) { return 'en'; }
  });
  const changeLang = (l) => { setLang(l); try { localStorage.setItem('tp_lang', l); } catch (e) {} };

  const acc = ACCENTS[tw.accent] || ACCENTS["#F4A52A"];
  const rootVars = {
    '--accent': tw.accent,
    '--on-accent': acc.on,
    '--shadow-accent': acc.glow,
    height: '100%',
  };

  return (
    <div style={rootVars}>
      <DesignCanvas>
        <DCSection id="homeowner" title="ThengaPari — Homeowner" subtitle="4 core screens · 390px · Android · tap any chip/CTA to walk the flow">
          {FRAMES.map((f) => (
            <DCArtboard key={f.id} id={f.id} label={f.label} width={404} height={814}
              style={{ background: 'transparent', boxShadow: 'none', borderRadius: 44, overflow: 'visible' }}>
              <div data-screen-label={f.label}>
                <PhoneApp initial={f.initial} tweaks={tw} lang={lang} setLang={changeLang} />
              </div>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={tw.accent}
          options={["#F4A52A", "#DD8413", "#D2693C", "#15786B"]}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Home dashboard" />
        <TweakRadio label="Earnings chart" value={tw.chart}
          options={[{ value: 'leaf', label: 'Leaf' }, { value: 'forest', label: 'Forest' }, { value: 'line', label: 'Line' }]}
          onChange={(v) => setTweak('chart', v)} />
        <TweakText label="Homeowner name" value={tw.greetName}
          onChange={(v) => setTweak('greetName', v)} />
        <TweakSelect label="Greeting" value={tw.greeting}
          options={[{ value: 'morning', label: 'Good morning' }, { value: 'afternoon', label: 'Good afternoon' }, { value: 'evening', label: 'Good evening' }]}
          onChange={(v) => setTweak('greeting', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={tw.density}
          options={[{ value: 'cozy', label: 'Cozy' }, { value: 'comfy', label: 'Comfy' }]}
          onChange={(v) => setTweak('density', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
