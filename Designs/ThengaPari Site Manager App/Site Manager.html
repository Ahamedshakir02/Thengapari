<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ThengaPari · Site Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="app.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #E7E2D6;
    background-image: radial-gradient(circle at 30% 20%, #EFEAE0, #E0DACB);
    min-height: 100vh; box-sizing: border-box;
    font-family: var(--font-text);
    position: relative; overflow: hidden;
  }
  #root { position: absolute; top: 50%; left: 50%; }
  #stage { transform-origin: center center; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <rect width="96" height="96" rx="20" fill="#1E4D2B"/>
      <circle cx="48" cy="56" r="20" fill="#F4A52A"/>
      <path d="M48 36 C48 26 44 19 36 14 C34 24 39 31 48 36 Z" fill="#CFE0BC"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screen1.jsx"></script>
  <script type="text/babel" src="screen2.jsx"></script>
  <script type="text/babel" src="screen3.jsx"></script>
  <script type="text/babel" src="screen4.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <div id="stage">
        <AndroidDevice width={390} height={844}>
          <App />
        </AndroidDevice>
      </div>
    );

    function fitStage() {
      const stage = document.getElementById("stage");
      if (!stage) return;
      const dev = stage.firstElementChild;
      if (!dev) return;
      const w = dev.offsetWidth, h = dev.offsetHeight;
      const s = Math.min(1, (window.innerWidth - 24) / w, (window.innerHeight - 24) / h);
      document.getElementById("root").style.transform = `translate(-50%,-50%) scale(${s})`;
    }
    window.addEventListener("resize", fitStage);
    setTimeout(fitStage, 60);
    setTimeout(fitStage, 300);
  </script>
</body>
</html>
