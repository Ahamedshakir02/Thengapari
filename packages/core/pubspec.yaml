name: core
description: "ThengaPari shared core: models, services, providers, theme, widgets."
version: 0.0.1
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, routing, models
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  firebase_analytics: ^12.4.2
  cloud_functions: ^6.3.2

  # Maps / location
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Storage / media / misc
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.1.0

  # UI helpers used by shared widgets/screens
  lottie: ^3.3.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  badges: ^3.2.0
  percent_indicator: ^4.2.5
  smooth_page_indicator: ^2.0.1
  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
