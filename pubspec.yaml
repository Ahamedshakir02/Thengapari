name: thengapari
description: "ThengaPari — Melos monorepo workspace root (shared core + 4 role apps)."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.1

# Dart pub workspace — the shared core package + the four per-role apps resolve
# together against one lockfile. Each member declares `resolution: workspace`.
workspace:
  - packages/core
  - apps/homeowner
  - apps/worker
  - apps/site_manager
  - apps/b2b

dev_dependencies:
  melos: ^6.3.2
  flutter_lints: ^6.0.0
